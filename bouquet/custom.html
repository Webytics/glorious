
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Bouquet | Glorious Gifts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f8;
      color: #333;
    }

    header {
      background: #8f2346;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .container h2 {
      text-align: center;
      color: #8f2346;
      margin-top: 0;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8f2346;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .other-box {
      display: none;
      margin-top: 10px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #8f2346;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #701a36;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8f2346;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px 12px;
        padding: 20px;
      }

      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Glorious Gifts</h1>
    <p>Create a bouquet made just for someone special</p>
  </header>

  <div class="container">
    <h2>Plan Your Custom Bouquet</h2>

    <p class="intro">
      Choose your favourite chocolates, flowers and extra products.
      If you want something different, select "Other" and write its name.
    </p>

    <form id="customBouquetForm">

      <label for="customerName">Your Name *</label>
      <input
        type="text"
        id="customerName"
        placeholder="Enter your name"
        required
      >

      <label for="chocolate">Choose Chocolates *</label>
      <select id="chocolate" required>
        <option value="">Select chocolate</option>
        <option>Dairy Milk</option>
        <option>KitKat</option>
        <option>Ferrero Rocher</option>
        <option>Snickers</option>
        <option>Mix of Chocolates</option>
        <option value="other">Other Chocolate</option>
      </select>

      <div class="other-box" id="otherChocolateBox">
        <label for="otherChocolateName">Enter Chocolate Name *</label>
        <input
          type="text"
          id="otherChocolateName"
          placeholder="e.g. Bounty, Galaxy, Lindt"
        >
      </div>

      <label for="flower">Choose Flowers *</label>
      <select id="flower" required>
        <option value="">Select flowers</option>
        <option>Red Roses</option>
        <option>White Roses</option>
        <option>Pink Roses</option>
        <option>Mixed Flowers</option>
        <option>No Flowers</option>
        <option value="other">Other Flowers</option>
      </select>

      <div class="other-box" id="otherFlowerBox">
        <label for="otherFlowerName">Enter Flower Name *</label>
        <input
          type="text"
          id="otherFlowerName"
          placeholder="e.g. Tulips, Sunflowers, Lilies"
        >
      </div>

      <label for="extraProduct">Would You Like to Add Another Product?</label>
      <select id="extraProduct">
        <option value="No extra product">No extra product</option>
        <option value="other">Other Product</option>
      </select>

      <div class="other-box" id="otherProductBox">
        <label for="otherProductName">Enter Product Name *</label>
        <input
          type="text"
          id="otherProductName"
          placeholder="e.g. Teddy bear, perfume, jewellery"
        >
      </div>

      <label for="size">Bouquet Size *</label>
      <select id="size" required>
        <option value="">Select bouquet size</option>
        <option>Small</option>
        <option>Medium</option>
        <option>Large</option>
        <option>Premium</option>
      </select>

      <label for="budget">Your Budget (PKR) *</label>
      <input
        type="number"
        id="budget"
        min="1"
        placeholder="Enter your budget in PKR"
        required
      >

      <label for="details">Additional Details</label>
      <textarea
        id="details"
        placeholder="Tell us about colours, wrapping, message card or any special request..."
      ></textarea>

      <button type="submit" class="submit-btn">
        Send Custom Order on WhatsApp
      </button>

    </form>

    <a href="../" class="back-link">← Back to Glorious Gifts</a>
  </div>

  <script>
    const chocolate = document.getElementById("chocolate");
    const flower = document.getElementById("flower");
    const extraProduct = document.getElementById("extraProduct");

    const otherChocolateBox =
      document.getElementById("otherChocolateBox");

    const otherFlowerBox =
      document.getElementById("otherFlowerBox");

    const otherProductBox =
      document.getElementById("otherProductBox");

    const otherChocolateName =
      document.getElementById("otherChocolateName");

    const otherFlowerName =
      document.getElementById("otherFlowerName");

    const otherProductName =
      document.getElementById("otherProductName");

    function showOtherOptions() {
      const chocolateIsOther = chocolate.value === "other";
      const flowerIsOther = flower.value === "other";
      const productIsOther = extraProduct.value === "other";

      otherChocolateBox.style.display =
        chocolateIsOther ? "block" : "none";

      otherFlowerBox.style.display =
        flowerIsOther ? "block" : "none";

      otherProductBox.style.display =
        productIsOther ? "block" : "none";

      otherChocolateName.required = chocolateIsOther;
      otherFlowerName.required = flowerIsOther;
      otherProductName.required = productIsOther;
    }

    chocolate.addEventListener("change", showOtherOptions);
    flower.addEventListener("change", showOtherOptions);
    extraProduct.addEventListener("change", showOtherOptions);

    document
      .getElementById("customBouquetForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const name =
          document.getElementById("customerName").value.trim();

        const chocolateChoice =
          chocolate.value === "other"
            ? otherChocolateName.value.trim()
            : chocolate.value;

        const flowerChoice =
          flower.value === "other"
            ? otherFlowerName.value.trim()
            : flower.value;

        const productChoice =
          extraProduct.value === "other"
            ? otherProductName.value.trim()
            : extraProduct.value;

        const size =
          document.getElementById("size").value;

        const budget =
          document.getElementById("budget").value;

        const details =
          document.getElementById("details").value.trim();

        const message =
`Hi Glorious Gifts! I want to create a custom bouquet.

Name: ${name}
Chocolates: ${chocolateChoice}
Flowers: ${flowerChoice}
Extra Product: ${productChoice}
Bouquet Size: ${size}
Budget: PKR ${budget}
Additional Details: ${details || "None"}

Please share the price and details. Thank you!`;

        const whatsappNumber = "923006031314";

        const whatsappURL =
          "https://wa.me/" +
          whatsappNumber +
          "?text=" +
          encodeURIComponent(message);

        window.open(whatsappURL, "_blank");
      });
  </script>

</body>
</html>
